name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Núcleo CAD + versionado (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p core test --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-reports, path: android/core/*/build/reports/tests/ }

  android:
    name: App Android
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }

  backend:
    name: API .NET 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet build backend/CadField.Api/CadField.Api.csproj -c Release
