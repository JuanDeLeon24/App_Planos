name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Núcleo CAD + versionado (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p core test --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-reports, path: android/core/*/build/reports/tests/ }

  android:
    name: App Android
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Caché de LibreDWG para Android
        id: ldwg
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/prebuilt
          key: libredwg-android-${{ hashFiles('android/app/src/main/cpp/build-libredwg.sh') }}
      - name: Compilar LibreDWG (arm64-v8a)
        if: steps.ldwg.outputs.cache-hit != 'true'
        run: android/app/src/main/cpp/build-libredwg.sh arm64-v8a
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
        working-directory: android
      - name: Verificar que el motor DWG está dentro del APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/*.apk | tee /tmp/apk.txt | grep libcadfield_dwg.so
          size=$(grep libcadfield_dwg.so /tmp/apk.txt | awk '{print $1}')
          echo "libcadfield_dwg.so = $size bytes"
          test "$size" -gt 1000000 || { echo "El APK contiene el stub, no LibreDWG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }

  backend:
    name: API .NET 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet build backend/CadField.Api/CadField.Api.csproj -c Release

  release-apk:
    name: Publicar APK para pruebas
    runs-on: ubuntu-latest
    needs: android
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app-debug-apk, path: apk }
      - name: Renombrar APK
        run: mv apk/*.apk "apk/CADFieldViewerPro-build${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "APK de prueba · build ${{ github.run_number }}"
          prerelease: true
          files: apk/*.apk
          body: |
            APK de depuración para pruebas (no publicar en Play Store).
            Rama: ${{ github.ref_name }} · commit ${{ github.sha }}

            **Instalar:** abra este enlace desde el teléfono Android (8.0+), descargue el `.apk`,
            permita "Instalar apps desconocidas" para el navegador o gestor de archivos y ábralo.
            Se instala como "CAD Field Viewer Pro" (paquete `com.cadfield.viewer.debug`).
